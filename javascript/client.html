  <meta charset="utf-8" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <input id="all" type="button" value="Voir tous les vols" />
    <h3>Tous les vols</h3>
    <input id="add" type="button" value="Ajouter un vol" />
  </header>

  <div id='main'>

    <nav id="nav1">
      <div id="vols">
      <script>
          document.addEventListener("DOMContentLoaded", function () {
            const btnVols = document.getElementById("all");
            const divVols = document.getElementById("vols");

            async function afficherVols() {
              //let url = 'http://127.0.0.1:5000/todo/api/v1.0/tasks';
              //let response = await fetch(url);
              //if (response.ok) {
                //let data = await response.json();
                divVols.innerHTML = ""; 

                /*let ul = document.createElement("ul");
                ul.className = "listeTaches";

                data.tasks.forEach(task => {
                  let li = document.createElement("li");
                  li.textContent = task.title;
                  li.dataset.uri = task.uri;
                  li.addEventListener('click', afficherTache);
                  ul.appendChild(li);
                });

                divVols.appendChild(ul);*/
                console.log("Voir tous les vols appuyé")
              } 
            

            if (btnVols) {
              btnVols.addEventListener("click", afficherVols);
              document.getElementById("add").addEventListener("click",creerVol);
            }

            async function afficherTache() {
              let url = this.dataset.uri;
              let response = await fetch(url);
              if (response.ok) {
                let data = await response.json();
                let task=data.task;
                let zone = document.querySelector('#currenttask')
                zone.innerHTML = "";

                let titre = document.createElement("input");
                titre.id="Titre";
                titre.type = "text";
                titre.value = task.title;

                let description = document.createElement("input");
                description.id="Description";
                description.type = "text";
                description.value = task.description;

                let label = document.createElement("label");
                label.textContent = "Tâche terminée : ";
                let finie = document.createElement("input");
                finie.id = "Done";
                finie.type = "checkbox";
                finie.checked = task.done;

                let id = document.createElement("input");
                id.id="ID";
                id.type = "hidden";
                id.value = this.dataset.uri;

                let sauvegarder= document.createElement("input");
                sauvegarder.id="sauvegarder";
                sauvegarder.type="button";
                sauvegarder.value="Sauvegarder les modifications";
                sauvegarder.addEventListener("click", sauvegarderTache);
                zone.append(titre,document.createElement("br"),description,document.createElement("br"),label,finie,document.createElement("br"),id, sauvegarder);
            }
            else {
                alert("Impossible de récuperer la tâche");
              }
            }
          

            async function sauvegarderTache() {
              let url = document.querySelector('#ID').value;
              let titre = document.querySelector('#Titre').value;
              let description = document.querySelector('#Description').value;
              let finie = document.querySelector('#Done').checked;
              let response = await fetch(url, { method: 'PUT', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ 
                title: titre,
               description : description,
              done : finie })});
                if (response.ok) {
                  alert("Tâche mise à jour !");
                  taches(); 
              } else {
                  alert("Erreur lors de la sauvegarde");
              }
            }


            async function supprimer() {
              let zone = document.querySelector('#currenttask');
              let titre =document.querySelector('#Titre');
              if( titre ){
                let url = document.querySelector('#ID').value;
                let response = await fetch(url, { method: 'DELETE', headers: {'Content-Type': 'application/json'}});
                  if (response.ok) {
                    alert("Tâche Supprimée !");
                    zone.innerHTML = "";
                    taches(); 
                } else {
                    alert("Erreur lors de la suppression");
                }
              }
              else{
                alert("Veuillez séléctionner une tâche d'abord");
              }
            }

            async function creerVol() {
              let zone = document.querySelector('#vols');
              zone.innerHTML = "";

              let colonneGauche =document.createElement("li");

              let labelCompagnie = document.createElement("label");
              labelCompagnie.textContent = "Compagnie : ";
              let compagnie = document.createElement("input");
              compagnie.id="Titre";
              compagnie.type = "text";

              let labelAD = document.createElement("label");
              labelAD.textContent = "Aéroport départ/ IATA : ";
              let aeroportD = document.createElement("input");
              aeroportD.id="AD";
              aeroportD.type = "text";

              let labelVD = document.createElement("label");
              labelVD.textContent = "Ville départ : ";
              let VilleD = document.createElement("input");
              VilleD.id="VD";
              VilleD.type = "text";

              let labelDD = document.createElement("label");
              labelDD.textContent = "Date départ : ";
              let DateD = document.createElement("input");
              DateD.id="DD";
              DateD.type = "date";

              

              
              let ajouter= document.createElement("input");
                ajouter.id="ajouter";
                ajouter.type="button";
                ajouter.value="Ajouter la tâche";
                ajouter.addEventListener("click", ajouterTache);

              colonneGauche.append(labelCompagnie,compagnie,document.createElement("br"),labelAD, aeroportD,document.createElement("br"),
            labelVD,VilleD,document.createElement("br"),labelDD,DateD,document.createElement("br"))
              zone.append(colonneGauche,ajouter);
            }

            async function ajouterTache() {
              let zone = document.querySelector('#currenttask');
                let url = 'http://127.0.0.1:5000/todo/api/v1.0/tasks';
                let titre = document.querySelector('#Titre').value;
                let description = document.querySelector('#Description').value;
                let finie = document.querySelector('#Done').checked;
                let response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'} ,body: JSON.stringify({ 
                title: titre,
               description : description,
              done : finie })});
                  if (response.ok) {
                    alert("Tâche ajoutée !");
                    taches(); 
                    zone.innerHTML="";
                } else {
                    alert("Erreur lors de l'ajout");
                }
            }
          })

        </script>
      </div>
    </nav>

  </div>
