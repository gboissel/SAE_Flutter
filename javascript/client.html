<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Vos tâches</title>

</head>

<body>
  <header id="header">
    <input id="all" type="button" value="Voir tous les vols" />
    <h3 id="titre"></h3>
    <input id="add" type="button" value="Ajouter un vol" />
  </header>

  <div id='main'>

    <nav id="nav1">
      <div id="vols">
        <script>
          document.addEventListener("DOMContentLoaded", function () {
            const btnVols = document.getElementById("all");
            const titre = document.getElementById("titre");
            const divVols = document.getElementById("vols");

            async function afficherVols() {
              let url = 'http://127.0.0.1:5000/api/vols/';
              let response = await fetch(url);
              if (response.ok) {
                let data = await response.json();
                divVols.innerHTML = "";

                let ul = document.createElement("ul");
                ul.className = "listeVols";
                console.log(data);
                for (let vol of data) {

                  let li = document.createElement("li");
                  li.className = 'Vol';
                  li.id = vol["numVol"];
                  let ulVol = document.createElement("ul");
                  let liNumCompagnie = document.createElement("li");
                  liNumCompagnie.className = "textevol";
                  liNumCompagnie.textContent = "N°" + vol["numVol"] + " - " + vol["Compagnie"];

                  let aeroDepart = await aeroport(vol["depart"]);
                  let aeroArrivee = await aeroport(vol["arriver"]);

                  let liVilles = document.createElement("li");
                  liVilles.className = "textevol";
                  liVilles.textContent = ` ${aeroDepart.ville} (${aeroDepart.CodePays}) - ${aeroArrivee.ville} (${aeroArrivee.CodePays}) `;

                  let liDepart = document.createElement("li");
                  liDepart.className = "textevol";
                  liDepart.textContent = "Départ :" +
                    new Date(vol.dateheureDep).toLocaleString('fr-FR', {
                      day: '2-digit',
                      month: '2-digit',
                      year: 'numeric',
                      hour: '2-digit',
                      minute: '2-digit'
                    }).replace(',', ' à').replace(':', 'h')
                    + ", " + vol["depart"] + ", " + vol["terminalDep"];

                  let liArrivee = document.createElement("li");
                  liArrivee.className = "textevol";
                  liArrivee.textContent = "Arrivée :" +
                    new Date(vol.dateheureArr).toLocaleString('fr-FR', {
                      day: '2-digit',
                      month: '2-digit',
                      year: 'numeric',
                      hour: '2-digit',
                      minute: '2-digit'
                    }).replace(',', ' à').replace(':', 'h') + ", " + vol["arriver"] + ", " + vol["terminalArr"];

                  let boutonSupp = document.createElement("input");
                  boutonSupp.id = "Supp";
                  boutonSupp.className = "BoutonVol";
                  boutonSupp.type = "button";
                  boutonSupp.value = "Supp";
                  boutonSupp.addEventListener("click", () => suppVol(vol));

                  let boutonModif = document.createElement("input");
                  boutonModif.className = "BoutonVol";
                  boutonModif.id = "Modif";
                  boutonModif.type = "button";
                  boutonModif.value = "Modif";
                  boutonModif.addEventListener("click", () => modifVol(vol));

                  let divBoutons = document.createElement("div");
                  divBoutons.style.display = "flex";
                  divBoutons.style.flexShrink = "0";


                  divBoutons.append(boutonSupp, boutonModif);

                  ulVol.append(liNumCompagnie, liVilles, liDepart, liArrivee);
                  li.append(ulVol, divBoutons);

                  ul.appendChild(li);
                }
                divVols.append(ul);
                titre.textContent = "Tous les vols"
              }
            };


            async function AllAeroport() {
              let url = 'http://127.0.0.1:5000/api/aeroport/';
              let response = await fetch(url);
              if (response.ok) {
                let data = await response.json();
                return data;
              }
            };

            async function aeroport(IATA) {
              let url = `http://127.0.0.1:5000/api/aeroport/${IATA}`;
              let response = await fetch(url);
              if (response.ok) {
                let data = await response.json();
                return data;
              }
            };

            async function suppVol(vol) {
              let url = `http://127.0.0.1:5000/api/vols/${vol.Compagnie}/${vol.numVol}/${Date.parse(vol.dateheureDep)}`
              let response = await fetch(url, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
              if (response.ok) {
                alert("Vol Supprimé !");
                afficherVols();
              } else {
                alert("Erreur lors de la suppression");
              }
              console.log(vol);
            }



            if (btnVols) {
              btnVols.addEventListener("click", afficherVols);
              document.getElementById("add").addEventListener("click", creerVol);
            }

              let num = document.createElement("input");
              num.className = 'ajout_modif';
              num.id = "Num";
              num.type = "text";
              num.value = vol.numVol;

              let labelPaysD = document.createElement("label");
              labelPaysD.textContent = "Pays départ : ";
              let PaysD = document.createElement("input");
              PaysD.className = 'ajout_modif';
              PaysD.id = "PD";
              PaysD.type = "text";
              PaysD.value = aeroDepart.CodePays;

              let LabelTerminalD = document.createElement("label");
              LabelTerminalD.textContent = "Terminal départ : ";
              let TerminalD = document.createElement("input");
              TerminalD.className = 'ajout_modif';
              TerminalD.id = "TD";
              TerminalD.type = "text";
              TerminalD.value = vol.terminalDep;

              let LabelHeureD = document.createElement("label");
              LabelHeureD.textContent = "Heure départ : ";
              let HeureD = document.createElement("input");
              HeureD.className = 'ajout_modif';
              HeureD.id = "HD";
              HeureD.type = "time";
              HeureD.value = lHeureD;


              let labelPaysA = document.createElement("label");
              labelPaysA.textContent = "Pays arrivée : ";
              let PaysA = document.createElement("input");
              PaysA.className = 'ajout_modif';
              PaysA.id = "PA";
              PaysA.type = "text";
              PaysA.value = aeroArrivee.CodePays;

              let LabelTerminalA = document.createElement("label");
              LabelTerminalA.textContent = "Terminal arrivée : ";
              let TerminalA = document.createElement("input");
              TerminalA.className = 'ajout_modif';
              TerminalA.id = "TA";
              TerminalA.type = "text";
              TerminalA.value = vol.terminalArr;

              let LabelHeureA = document.createElement("label");
              LabelHeureA.textContent = "Heure arrivée : ";
              let HeureA = document.createElement("input");
              HeureA.className = 'ajout_modif';
              HeureA.id = "HA";
              HeureA.type = "time";
              HeureA.value = lHeureA;


              let ligneBouton = document.createElement("div");
              ligneBouton.id = "conteneur-bouton";

              let modifer = document.createElement("input");
              modifer.className = 'ajout_modif';
              modifer.id = "modifer";
              modifer.type = "button";
              modifer.value = "Modifer le vol";
              modifer.addEventListener("click", () => sauvegarderVol);

              colonneGauche.append(labelCompagnie, compagnie,
                labelAD, aeroportD, labelVD, VilleD, labelDD, DateD,
                labelAA, aeroportA, labelVA, VilleA, labelDA, DateA,
              )

              colonneDroite.append(Labelnum, num,
                labelPaysD, PaysD, LabelTerminalD, TerminalD, LabelHeureD, HeureD,
                labelPaysA, PaysA, LabelTerminalA, TerminalA, LabelHeureA, HeureA,
              )
              ligneBouton.append(modifer);
              divVols.append(colonneGauche, colonneDroite, ligneBouton);


            }
